<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Любими имоти</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header-inner">
    <h1>Любими имоти</h1>
    <nav class="top-nav">
      <a href="index.html" class="top-btn">Начало</a>
    </nav>
  </header>

  <main>
    <!-- Wishlist grid container -->
    <section id="wishlistProperties" class="properties"></section>
  </main>

<!-- Property details modal -->
<div id="propertyDetailsModal" class="modal" style="display:none;">
  <div class="modal-content" style="position:relative; max-width:800px; margin:auto; padding:20px; background:#fff; border-radius:12px;">
    
    <!-- Close button -->
    <span class="close" style="position:absolute; top:10px; right:15px; font-size:28px; font-weight:bold; cursor:pointer; z-index:10;">&times;</span>

    <!-- Image wrapper -->
    <div style="position:relative; text-align:center;">
      <!-- Property image -->
      <img id="propImage" src="" alt="" style="width:100%; max-height:500px; object-fit:contain; border-radius:12px; z-index:1; position:relative;">

      <!-- Arrows -->
      <button id="prevImageBtn" style="position:absolute; top:50%; left:0; transform:translateY(-50%); background:none; border:none; font-size:36px; font-weight:bold; cursor:pointer; z-index:5;">❮</button>
      <button id="nextImageBtn" style="position:absolute; top:50%; right:0; transform:translateY(-50%); background:none; border:none; font-size:36px; font-weight:bold; cursor:pointer; z-index:5;">❯</button>

      <!-- Dots -->
      <div id="propImageDots" style="position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:5;"></div>
    </div>

    <!-- Property details -->
    <h2 id="propTitle" style="margin-top:20px;"></h2>
    <p id="propPrice"></p>
    <p id="propCategory"></p>
    <p id="propStatus"></p>
    <p id="propType"></p>
    <p id="propBedrooms"></p>
    <p id="propBathrooms"></p>
    <p id="propArea"></p>
    <p id="propYear"></p>
    <p id="propDescription"></p>
  </div>
</div>



  <div id="toast" class="toast"></div>
  <script type="module" src="properties.js"></script>
  <script type="module" src="wishlist.js"></script>

</body>
</html>
