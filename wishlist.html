<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Любими имоти</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header-inner">
    <h1>Любими имоти</h1>
    <nav class="top-nav">
      <a href="index.html" class="top-btn">Начало</a>
    </nav>
  </header>

  <main>
    <!-- Wishlist grid container -->
    <section id="wishlistProperties" class="properties"></section>
  </main>

<!-- Property details modal -->
<div id="propertyDetailsModal" class="modal" style="display:none;">
  <div class="modal-content" style="
      position:relative;
      max-width:800px;
      margin:auto;
      padding:20px;
      background:#cde0f3; /* light blue background */
      color:#fff; /* white text */
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
  ">
    
    <!-- Close button -->
    <span class="close" style="
        position:absolute; top:10px; right:15px;
        font-size:28px; font-weight:bold;
        cursor:pointer; z-index:10;
        color:#fff;
    ">&times;</span>

    <!-- Image wrapper -->
    <div style="position:relative; text-align:center; margin-top:30px;">
      <!-- Property image -->
      <img id="propImage" src="" alt="" style="
          width:100%;
          max-height:500px;
          object-fit:cover;
          border-radius:12px;
          z-index:1;
          position:relative;
      ">

      <!-- Arrows -->
      <button id="prevImageBtn" style="
          position:absolute;
          top:50%;
          left:0;
          transform:translateY(-50%);
          background:none;
          border:none;
          font-size:36px;
          font-weight:bold;
          cursor:pointer;
          z-index:5;
          color:#fff; /* arrows white */
      ">❮</button>
      <button id="nextImageBtn" style="
          position:absolute;
          top:50%;
          right:0;
          transform:translateY(-50%);
          background:none;
          border:none;
          font-size:36px;
          font-weight:bold;
          cursor:pointer;
          z-index:5;
          color:#fff; /* arrows white */
      ">❯</button>

      <!-- Dots -->
      <div id="propImageDots" style="
          position:absolute;
          bottom:10px;
          left:50%;
          transform:translateX(-50%);
          display:flex;
          gap:6px;
          z-index:5;
      "></div>
    </div>

    <!-- Property details -->
    <div class="property-content" style="margin-top:15px; line-height:1.5;">
        <h2 id="propTitle" style="margin-bottom:10px;"></h2>
        <p><strong>Цена:</strong> <span id="propPrice"></span></p>
        <p><strong>Категория:</strong> <span id="propCategory"></span></p>
        <p><strong>Статус:</strong> <span id="propStatus"></span></p>
        <p><strong>Тип:</strong> <span id="propType"></span></p>
        <p><strong>Спални:</strong> <span id="propBedrooms"></span></p>
        <p><strong>Бани:</strong> <span id="propBathrooms"></span></p>
        <p><strong>Площ:</strong> <span id="propArea"></span></p>
        <p><strong>Година на строеж:</strong> <span id="propYear"></span></p>
        <p><strong>Описание:</strong></p>
        <p id="propDescription" style="white-space: pre-line;"></p>
    </div>
  </div>
</div>


</div>
<div id="globalLoader">
  <div class="loader-box">Зареждане…</div>
</div>



  <div id="toast" class="toast"></div>
  <script type="module" src="properties.js"></script>
  <script type="module" src="wishlist.js"></script>

</body>
</html>
